services:
  api:
    build:
      context: .
      target: api
    environment:
      ADDR: ":8080"
      DB_DIR: /data
    volumes:
      - storyproof-data:/data
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8081}:80"
    restart: unless-stopped

  # One-shot verification: Go tests, Playwright browser tests, production
  # build and HTTP smoke. Run with: docker compose --profile verify run --rm verify
  verify:
    profiles: ["verify"]
    build:
      context: .
      target: verify
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    environment:
      WEB_PORT: "${WEB_PORT:-8081}"
      API_PORT: "${API_PORT:-8080}"

volumes:
  storyproof-data:
